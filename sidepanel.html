<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GH Workspace</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="topbar">
    <div><strong>GH WORKSPACE</strong><small id="sync-state">未同期</small></div>
    <button id="refresh" title="同期">↻</button>
  </header>
  <nav id="tabs" class="tabs" aria-label="workspace tabs">
    <button class="active" data-view="resume">Resume</button>
    <button data-view="sessions">Sessions</button>
    <button data-view="repos">Repos</button>
    <button data-view="issues">Issues</button>
    <button data-view="actions">Actions</button>
    <button data-view="deploy">Deploy</button>
    <button data-view="skills">Skills</button>
  </nav>
  <main id="app" aria-live="polite"></main>
  <footer>
    <form id="token-form" hidden>
      <label>GitHub fine-grained token<input id="token" type="password" autocomplete="off" placeholder="ghp_…"></label>
      <button>保存</button><button type="button" id="clear-token">消去</button>
    </form>
    <button id="settings">Token設定</button>
    <span id="error" role="alert"></span>
  </footer>
  <script src="sidepanel.js"></script>
</body>
</html>
